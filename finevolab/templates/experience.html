<!doctype html>
<html lang="zh-CN" data-live="true">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="FinEvoLab 邀请制财报分析：提问、追踪执行并下载报告。"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>FinEvoLab · 分析工作台</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./experience.css" />
    <script defer src="./experience.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main" data-text="skip">跳转到正文</a>
    <div class="shell">
      <header class="header">
        <a class="brand" href="https://finevolab.lunelu.com/"
          ><img src="./favicon.svg" width="36" height="36" alt="" /><span
            >FinEvoLab<span class="brand-dot">.</span></span
          ></a
        >
        <nav aria-label="Workspace">
          <a href="https://finevolab.lunelu.com/" data-text="home"
            >返回项目展示 ↗</a
          ><a href="#live" data-text="live">真实分析</a>
        </nav>
        <div class="header-actions">
          <button class="language" id="language-toggle" type="button">
            EN ↗
          </button>
        </div>
      </header>
      <main id="main">
        <section class="workspace-hero">
          <h1 data-text="title">让问题，成为有据可循的分析。</h1>
          <p data-text="intro">
            登录后提出财报问题，查看执行状态、证据引用与分析结果，并下载报告。
          </p>
        </section>
        <section class="section" id="live">
          <div class="section-heading">
            <div>
              <h2 data-text="live">真实分析</h2>
            </div>
          </div>
          <article class="workspace-card">
            <p id="live-mode" class="mode-banner"></p>
            <form id="login-form">
              <label for="invite" data-text="invite">邀请口令</label>
              <div class="login-row">
                <input
                  id="invite"
                  type="password"
                  autocomplete="off"
                  minlength="20"
                  maxlength="200"
                  required
                /><button
                  class="button primary"
                  type="submit"
                  data-text="signIn"
                >
                  登录
                </button>
              </div>
            </form>
            <div id="analysis-workspace" hidden>
              <div class="session-row">
                <p id="session-info"></p>
                <button
                  id="logout"
                  class="language"
                  type="button"
                  data-text="signOut"
                >
                  退出登录
                </button>
              </div>
              <form id="question-form">
                <label for="question" data-text="question">分析问题</label
                ><textarea
                  id="question"
                  rows="4"
                  maxlength="2000"
                  required
                ></textarea>
                <div class="question-actions">
                  <button
                    id="example"
                    class="button secondary"
                    type="button"
                    data-text="example"
                  >
                    填入分析示例</button
                  ><button
                    id="submit-task"
                    class="button primary"
                    type="submit"
                    data-text="run"
                  >
                    开始真实分析
                  </button>
                </div>
              </form>
              <p data-text="taskNote">
                使用固定公开财报。每日额度按 UTC
                统计；每次任务执行都有模型、工具、Token 与时间预算。
              </p>
              <div id="task-history"></div>
              <div id="task-output" aria-live="polite"></div>
            </div>
            <p id="live-status" role="status" aria-live="polite"></p>
          </article>
        </section>
      </main>
      <footer>
        <a class="brand" href="https://finevolab.lunelu.com/">FinEvoLab.</a
        ><a
          class="text-link"
          href="https://github.com/Zayne-Feng/FinEvoLab"
          rel="noopener noreferrer"
          target="_blank"
          >GitHub ↗</a
        >
      </footer>
    </div>
  </body>
</html>
